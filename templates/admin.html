<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Jobura</title>

<style>
body {
    font-family: Arial;
    background: #0b0f19;
    color: #e5e7eb;
    padding: 20px;
}

h2 { color: #60a5fa; }

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #374151;
    text-align: left;
}

button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }

.card {
    background: #111827;
    padding: 20px;
    border-radius: 10px;
}

/* ✅ FIX: CENTER CONTENT (your production issue) */
.container {
    max-width: 1000px;
    margin: auto;
}
</style>
</head>

<body>

<div class="container">

<h2>🔐 Jobura Admin Panel</h2>

<div class="card">

<table>
<tr>
<th>Code</th>
<th>Phone</th>
<th>Status</th>
<th>Expires</th>
<th>Action</th>
</tr>

{% for u in users %}
<tr>
<td>{{ u.code }}</td>
<td>{{ u.phone }}</td>
<td>{{ u.status }}</td>
<td>{{ u.expiry if u.expiry else "-" }}</td>

<td>
{% if u.status != "approved" %}
<a href="/approve/{{ u.code }}">
<button class="approve">Approve</button>
</a>
{% else %}
<span style="color:lightgreen;">✔ Active</span>
{% endif %}
</td>

</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
