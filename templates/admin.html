<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Jobura</title>

<style>
body {
    font-family: Arial;
    background: #0b0f19;
    color: #e5e7eb;
    padding: 20px;
}

h2 { color: #60a5fa; }

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #374151;
}

button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }

.card {
    background: #111827;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h2>🔐 Jobura Admin Panel</h2>

<div class="card">

<table>
<tr>
<th>Code</th>
<th>Phone</th>
<th>Status</th>
<th>Expires</th>
<th>Action</th>
</tr>

{% for u in users %}
<tr>
<td>{{ u.code }}</td>
<td>{{ u.phone }}</td>
<td>{{ u.status }}</td>
<td>{{ u.expiry if u.expiry else "—" }}</td>

<td>

{% if u.status == "pending" %}

    <a href="/approve/{{ u.code }}/monthly">
        <button class="approve">Approve Monthly</button>
    </a>

    <a href="/approve/{{ u.code }}/yearly">
        <button class="approve">Approve Yearly</button>
    </a>

    <a href="/reject/{{ u.code }}">
        <button class="reject">Reject</button>
    </a>

{% elif u.status == "approved" %}
    <span style="color:lightgreen;">✔ Active</span>

{% elif u.status == "rejected" %}
    <span style="color:red;">✖ Rejected</span>

{% endif %}

</td>

</tr>
{% endfor %}

</table>

</div>

</body>
</html>
