<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Jobura</title>

<style>
body {
    font-family: Arial;
    background: #0b0f19;
    color: #e5e7eb;
    padding: 20px;
}

h2 { color: #60a5fa; }

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #374151;
    text-align: left;
}

button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.approve { background: green; color: white; }
.yearly { background: #2563eb; color: white; }
.reject { background: red; color: white; }

.card {
    background: #111827;
    padding: 20px;
    border-radius: 10px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    background: #374151;
    color: white;
}
</style>
</head>

<body>

<div class="top-bar">
    <h2>🔐 Jobura Admin Panel</h2>
    <a href="/logout">
        <button class="logout">Logout</button>
    </a>
</div>

<div class="card">

<table>
<tr>
<th>Code</th>
<th>Phone</th>
<th>Status</th>
<th>Expires</th>
<th>Action</th>
</tr>

{% for u in users %}
<tr>
<td>{{ u.code }}</td>
<td>{{ u.phone if u.phone else "-" }}</td>
<td>{{ u.status }}</td>
<td>{{ u.expiry if u.expiry else "-" }}</td>

<td>

{% if u.status != "approved" %}

<!-- ✅ MONTHLY APPROVE -->
<a href="/approve/{{ u.code }}/monthly">
<button class="approve">Monthly</button>
</a>

<!-- ✅ YEARLY APPROVE -->
<a href="/approve/{{ u.code }}/yearly">
<button class="yearly">Yearly</button>
</a>

<!-- ✅ REJECT -->
<a href="/reject/{{ u.code }}">
<button class="reject">Reject</button>
</a>

{% else %}
<span style="color:lightgreen;">✔ Active</span>
{% endif %}

</td>

</tr>
{% endfor %}

</table>

</div>

</body>
</html>
